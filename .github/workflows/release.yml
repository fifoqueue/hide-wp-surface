name: CI and Release

"on":
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.metadata.outputs.plugin_version }}
    env:
      PLUGIN_DIR: hide-wp-surface
      ZIP_NAME: hide-wp-surface.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, wp-cli:2.12.0

      - name: Validate version metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' hide-wp.php | head -n 1 | xargs)"
          constant_version="$(sed -n "s/^define( 'HIDE_WP_VERSION', '\([^']*\)' );/\1/p" hide-wp.php | head -n 1 | xargs)"
          stable_tag="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n 1 | xargs)"

          if [[ -z "${plugin_version}" ]]; then
            echo "Could not read the plugin Version header." >&2
            exit 1
          fi

          if [[ "${plugin_version}" != "${constant_version}" ]]; then
            echo "Version header (${plugin_version}) does not match HIDE_WP_VERSION (${constant_version})." >&2
            exit 1
          fi

          if [[ "${plugin_version}" != "${stable_tag}" ]]; then
            echo "Version header (${plugin_version}) does not match readme Stable tag (${stable_tag})." >&2
            exit 1
          fi

          if [[ ! "${plugin_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "Plugin version (${plugin_version}) is not a valid release version for this workflow." >&2
            exit 1
          fi

          echo "plugin_version=${plugin_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate Composer metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f composer.json ]]; then
            composer validate --no-check-publish

            locked_package_count="$(php -r '
                $lock = json_decode(
                    file_get_contents("composer.lock"),
                    true,
                    512,
                    JSON_THROW_ON_ERROR
                );
                echo count($lock["packages"] ?? []) + count($lock["packages-dev"] ?? []);
              ')"

            if (( locked_package_count > 0 )); then
              composer audit --locked --no-interaction
            else
              echo 'No locked Composer packages to audit.'
            fi
          fi

      - name: Validate translations
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/i18n
          wp i18n make-pot . build/i18n/hide-wp-surface.pot \
            --domain=hide-wp-surface \
            --exclude=.github,.idea,.tools,build,dist,lib,runtime,vendor \
            --headers='{"Report-Msgid-Bugs-To":"https://github.com/fifoqueue/hide-wp-surface/issues","POT-Creation-Date":""}'
          cmp languages/hide-wp-surface.pot build/i18n/hide-wp-surface.pot

          cp languages/hide-wp-surface-ko_KR.po build/i18n/hide-wp-surface-ko_KR.po
          wp i18n update-po \
            build/i18n/hide-wp-surface.pot \
            build/i18n/hide-wp-surface-ko_KR.po
          cmp languages/hide-wp-surface-ko_KR.po build/i18n/hide-wp-surface-ko_KR.po

          wp i18n make-mo \
            languages/hide-wp-surface-ko_KR.po \
            languages/hide-wp-surface-ko_KR.mo

          wp i18n make-php \
            languages/hide-wp-surface-ko_KR.po \
            languages

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './build' -prune -o \
            -path './dist' -prune -o \
            -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Run compatibility regression checks
        run: |
          php tests/regression.php
          php tests/regression.php uninstall
          php tests/regression.php unsupported

      - name: Stamp GitHub repository metadata
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          cat > /tmp/hide-wp-stamp.php <<'PHP'
          <?php
          $repo = getenv('RELEASE_REPOSITORY');

          if (!is_string($repo) || !preg_match('/\A[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\z/', $repo)) {
              fwrite(STDERR, 'Invalid GitHub repository: ' . (string) $repo . PHP_EOL);
              exit(1);
          }

          $file = 'hide-wp.php';
          $source = file_get_contents($file);

          if (!is_string($source)) {
              fwrite(STDERR, 'Could not read ' . $file . PHP_EOL);
              exit(1);
          }

          $source = preg_replace(
              '/Plugin URI:\s+https:\/\/github\.com\/[^\r\n]+/',
              'Plugin URI:  https://github.com/' . $repo,
              $source
          );

          $source = preg_replace(
              '/Update URI:\s+https:\/\/github\.com\/[^\r\n]+/',
              'Update URI:  https://github.com/' . $repo,
              $source
          );

          file_put_contents($file, $source);
          PHP

          php /tmp/hide-wp-stamp.php

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.metadata.outputs.plugin_version }}'
          awk -v version="${version}" '
            $0 == "= " version " =" { found = 1; next }
            found && /^= [0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)* =$/ { exit }
            found { print }
          ' readme.txt > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'Hide WP Surface %s\n' "${version}" > release-notes.md
          fi

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p "build/${PLUGIN_DIR}" dist
          rsync -a ./ "build/${PLUGIN_DIR}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude '.gitignore' \
            --exclude '*.iml' \
            --exclude '*.patch' \
            --exclude 'release-notes.md' \
            --exclude '.hide-wp-recovery' \
            --exclude 'runtime/paths-enabled.php' \
            --exclude 'runtime/paths-probe.php' \
            --exclude 'runtime/paths-enabled.flag' \
            --exclude 'runtime/paths-enabled-*.php' \
            --exclude 'runtime/paths-probe-*.php' \
            --exclude 'runtime/login-enabled-*.php' \
            --exclude 'runtime/login-probe-*.php'

          ( cd build && zip -r "../dist/${ZIP_NAME}" "${PLUGIN_DIR}" )
          ( cd dist && sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256" )
          unzip -l "dist/${ZIP_NAME}" | grep -F "${PLUGIN_DIR}/hide-wp.php"
          unzip -l "dist/${ZIP_NAME}" | grep -F "${PLUGIN_DIR}/readme.txt"
          ( cd dist && sha256sum --check "${ZIP_NAME}.sha256" )

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hide-wp-surface-package
          path: |
            dist/hide-wp-surface.zip
            dist/hide-wp-surface.zip.sha256
            release-notes.md
          retention-days: 14

  release:
    name: Create version tag and GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: hide-wp-surface-package
          path: release-dist

      - name: Create version tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.build.outputs.plugin_version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_name="v${PLUGIN_VERSION}"
          zip_path='release-dist/dist/hide-wp-surface.zip'
          checksum_path='release-dist/dist/hide-wp-surface.zip.sha256'
          notes_path='release-dist/release-notes.md'

          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists. Bump Version, HIDE_WP_VERSION, and Stable tag before pushing a new release." >&2
            exit 1
          fi

          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "Release ${tag_name} already exists. Bump the plugin version before pushing a new release." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag_name}" -m "Hide WP Surface ${PLUGIN_VERSION}" "${COMMIT_SHA}"
          git push origin "${tag_name}"

          gh release create "${tag_name}" "${zip_path}" "${checksum_path}" \
            --target "${COMMIT_SHA}" \
            --title "Hide WP Surface ${PLUGIN_VERSION}" \
            --notes-file "${notes_path}"
